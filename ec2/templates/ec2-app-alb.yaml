---
AWSTemplateFormatVersion: 2010-09-09

Description: ALB, Target Group, and EC2 instance for application environment

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: VPC Configuration
        Parameters:
          - pDeploymentName
          - pVpcId
          - pSubnetPublicA
          - pSubnetPublicB
          - pSubnetPrivateA
          - pCertificateArn
          - pAccessLogBucket
          - pAllowedIpRange
    ParameterLabels:
      pDeploymentName:
        default: Deployment Name
      pVpcId:
        default: VPC ID
      pSubnetPublicA:
        default: Public Subnet A ID
      pSubnetPublicB:
        default: Public Subnet B ID
      pSubnetPrivateA:
        default: Private Subnet A ID
      pCertificateArn:
        default: SSL Certificate ARN
      pAccessLogBucket:
        default: S3 Bucket for ALB Access Logs
      pAllowedIpRange:
        default: Allowed IP Range

Parameters:
  pDeploymentName:
    Type: String
    Description: Name of the deployment/project/application (e.g., app-development, app-production)
    Default: ""
    MaxLength: 32

  pVpcId:
    Type: AWS::EC2::VPC::Id
    Description: ID of the VPC (from the VPC stack output oVPC)

  pSubnetPublicA:
    Type: AWS::EC2::Subnet::Id
    Description: ID of the public subnet in AZ A (from the VPC stack output oSubnetPublicA)

  pSubnetPublicB:
    Type: AWS::EC2::Subnet::Id
    Description: ID of the public subnet in AZ B (from the VPC stack output oSubnetPublicB)

  pSubnetPrivateA:
    Type: AWS::EC2::Subnet::Id
    Description: ID of the private subnet in AZ A (from the VPC stack output oSubnetPrivateA)

  pCertificateArn:
    Type: String
    Description: ARN of the SSL certificate for the ALB (e.g., for example.com)

  pAccessLogBucket:
    Type: String
    Description: S3 bucket name for ALB access logs

  pAllowedIpRange:
    Type: String
    Description: Allowed IP range (e.g., "10.0.0.0/8")

Resources:

  # Security Group for the ALB (allow HTTP/HTTPS from the internet)
  rSecurityGroupAlb:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for ALB allowing HTTP and HTTPS
      VpcId: !Ref pVpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref pAllowedIpRange
          Description: Allow HTTP traffic from allowed IP range
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref pAllowedIpRange
          Description: Allow HTTPS traffic from allowed IP range
      Tags:
        - Key: Name
          Value: !Sub "${pDeploymentName}-main-ALB-SG"
        - Key: GitHub
          Value: quiverstone/armory

  # Security Group for the EC2 instance (allow traffic from the ALB)
  rSecurityGroupEc2:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for EC2 allowing traffic from ALB
      VpcId: !Ref pVpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref rSecurityGroupAlb
          Description: Allow HTTP traffic from ALB
      Tags:
        - Key: Name
          Value: !Sub "${pDeploymentName}-main-EC2-SG"
        - Key: GitHub
          Value: quiverstone/armory

  # IAM Role for the EC2 instance (basic SSM access for troubleshooting)
  rIamRoleEc2:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      RoleName: !Sub "${pDeploymentName}-main-${AWS::Region}-RoleEC2"
      Tags:
        - Key: GitHub
          Value: quiverstone/armory

  # IAM Instance Profile for the EC2 instance
  rIamInstanceProfileEc2:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref rIamRoleEc2
      InstanceProfileName: !Sub "${pDeploymentName}-main-${AWS::Region}-ProfileEC2"

  # EC2 Instance in the private subnet
  rEc2InstanceMain:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      SubnetId: !Ref pSubnetPrivateA
      SecurityGroupIds:
        - !Ref rSecurityGroupEc2
      IamInstanceProfile: !Ref rIamInstanceProfileEc2
      ImageId: "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2}}"
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum update -y
          yum install -y httpd
          systemctl start httpd
          systemctl enable httpd
          echo "<h1>Hello from ${pDeploymentName} EC2</h1>" > /var/www/html/index.html
      Tags:
        - Key: Name
          Value: !Sub "${pDeploymentName}-main-EC2"
        - Key: GitHub
          Value: quiverstone/armory

  # Target Group for the ALB
  rTargetGroupMain:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      HealthCheckPath: /
      HealthCheckPort: 80
      HealthCheckProtocol: HTTP
      Port: 80
      Protocol: HTTP
      TargetType: instance
      VpcId: !Ref pVpcId
      Targets:
        - Id: !Ref rEc2InstanceMain
      Name: !Sub "${pDeploymentName}"
      Tags:
        - Key: Name
          Value: !Sub "${pDeploymentName}-main-TargetGroup"
        - Key: GitHub
          Value: quiverstone/armory

  # Application Load Balancer in the public subnets
  rAlbMain:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Subnets:
        - !Ref pSubnetPublicA
        - !Ref pSubnetPublicB
      SecurityGroups:
        - !Ref rSecurityGroupAlb
      Scheme: internet-facing
      Type: application
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
        - Key: access_logs.s3.enabled
          Value: "true"
        - Key: access_logs.s3.bucket
          Value: !Ref pAccessLogBucket
        - Key: access_logs.s3.prefix
          Value: !Sub "${pDeploymentName}/alb"
      Tags:
        - Key: Name
          Value: !Sub "${pDeploymentName}-main-ALB"
        - Key: GitHub
          Value: quiverstone/armory

  # HTTPS Listener (port 443) forwarding to the target group
  rListenerHttps:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref rAlbMain
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS-1-2-2017-01
      Certificates:
        - CertificateArn: !Ref pCertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref rTargetGroupMain
      Tags:
        - Key: GitHub
          Value: quiverstone/armory

  # HTTP Listener (port 80) redirecting to HTTPS
  rListenerHttp:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref rAlbMain
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: 443
            Host: "#{host}"
            Path: "/#{path}"
            Query: "#{query}"
            StatusCode: HTTP_301
      Tags:
        - Key: GitHub
          Value: quiverstone/armory

Outputs:
  oAlb:
    Description: DNS name of the Application Load Balancer
    Value: !GetAtt rAlbMain.DNSName
    Export:
      Name: !Sub ${AWS::StackName}-oAlb

  oTargetGroup:
    Description: ARN of the Target Group
    Value: !Ref rTargetGroupMain
    Export:
      Name: !Sub ${AWS::StackName}-oTargetGroup

  oEc2Instance:
    Description: ID of the EC2 Instance
    Value: !Ref rEc2InstanceMain
    Export:
      Name: !Sub ${AWS::StackName}-oEc2Instance
