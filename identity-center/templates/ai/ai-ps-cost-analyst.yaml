AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  AI programmatic-access Permission Set (ai-cost-analyst): read-only Cost
  Explorer, Cost and Usage Report, Budgets, Savings Plans and pricing visibility
  for AI tooling to profile service usage across org accounts. No writes.

Metadata:
  metaTemplateInfo:
    PermissionSetName: ai-cost-analyst
    Tier: read-only
    ManagedBy: aws-ai-team-permission-sets
    Version: 1.0.0
    Source: armory/identity-center/templates/ai/ai-ps-cost-analyst.yaml
    LastUpdated: 20261113

  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: IAM Identity Center
        Parameters:
          - pInstanceArn
      - Label:
          default: Permission Set Configuration
        Parameters:
          - pSessionDuration
          - pCostReportBucketName
      - Label:
          default: Governance Tags
        Parameters:
          - pEnvironment
          - pProject
          - pOwner
          - pCostCenter
          - pDataClassification

Parameters:
  pInstanceArn:
    Type: String
    Description: ARN of the IAM Identity Center instance (sso-admin list-instances)
    AllowedPattern: "^arn:aws[a-z-]*:sso:::instance/ssoins-[0-9a-f]{16}$"
    ConstraintDescription: Must be an IAM Identity Center instance ARN

  pSessionDuration:
    Type: String
    Description: Max session duration (ISO-8601).
    Default: PT1H
    AllowedValues: [PT1H, PT2H, PT4H, PT8H, PT12H]
    ConstraintDescription: Must be one of PT1H, PT2H, PT4H, PT8H, PT12H

  pEnvironment:
    Type: String
    Default: all
    AllowedValues: [dev, staging, prod, all]
    Description: Deployment environment scope for the tag.
    ConstraintDescription: Must be dev, staging, prod or all

  pProject:
    Type: String
    Default: aws-ai-team-permission-sets
    Description: Project name tag.
    AllowedPattern: ^[\w .:/=+@-]{1,256}$
    ConstraintDescription: '1-256 letters, digits, spaces and _ . : / = + @ -'

  pOwner:
    Type: String
    Default: owner@example.com
    Description: Owning team email tag.
    AllowedPattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
    ConstraintDescription: Must be an email address

  pCostCenter:
    Type: String
    Default: unassigned
    Description: Cost center id tag.
    AllowedPattern: ^[\w .:/=+@-]{1,256}$
    ConstraintDescription: '1-256 letters, digits, spaces and _ . : / = + @ -'

  pDataClassification:
    Type: String
    Default: confidential
    AllowedValues: [public, internal, confidential, restricted]
    Description: Data classification tag (billing data is treated as confidential).
    ConstraintDescription: Must be public, internal, confidential or restricted

  pCostReportBucketName:
    Description: S3 bucket that holds Cost and Usage Report / Data Exports files. Leave empty to grant no S3 access
    Type: String
    Default: ""
    AllowedPattern: ^$|^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$
    ConstraintDescription: Must be empty or a valid S3 bucket name

Conditions:
  cHasCostReportBucket: !Not [!Equals [!Ref pCostReportBucketName, ""]]

Resources:
  rSsoPermissionSetAiCostAnalyst:
    Type: AWS::SSO::PermissionSet
    Properties:
      Name: ai-cost-analyst
      Description: "AI cost analyst: read-only Cost Explorer / CUR / Budgets / Savings Plans for cross-account usage profiling."
      InstanceArn: !Ref pInstanceArn
      SessionDuration: !Ref pSessionDuration
      ManagedPolicies:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AWSBillingReadOnlyAccess
      InlinePolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: CostAndUsageVisibility
            Effect: Allow
            Action:
              - ce:Get*
              - ce:List*
              - ce:Describe*
              - cur:DescribeReportDefinitions
              - cur:GetUsageReport
              - cur:GetClassicReport
              - cur:GetClassicReportPreferences
              - cur:ValidateReportDestination
              - bcm-data-exports:GetExport
              - bcm-data-exports:ListExports
              - bcm-data-exports:GetTable
              - bcm-data-exports:ListTables
              - budgets:ViewBudget
              - budgets:Describe*
              - savingsplans:Describe*
              - savingsplans:List*
              - freetier:GetFreeTierUsage
              - pricing:GetProducts
              - pricing:DescribeServices
              - pricing:GetAttributeValues
              - organizations:ListAccounts
              - organizations:DescribeOrganization
              - consolidatedbilling:ListLinkedAccounts
              - consolidatedbilling:GetAccountBillingRole
            Resource: "*"
          - !If
            - cHasCostReportBucket
            - Sid: CostReportBucketRead
              Effect: Allow
              Action:
                - s3:GetObject
                - s3:ListBucket
              Resource:
                - !Sub arn:${AWS::Partition}:s3:::${pCostReportBucketName}
                - !Sub arn:${AWS::Partition}:s3:::${pCostReportBucketName}/*
            - !Ref AWS::NoValue
      Tags:
        - Key: Name
          Value: ai-cost-analyst
        - Key: Environment
          Value: !Ref pEnvironment
        - Key: Project
          Value: !Ref pProject
        - Key: Owner
          Value: !Ref pOwner
        - Key: CostCenter
          Value: !Ref pCostCenter
        - Key: DataClassification
          Value: !Ref pDataClassification
        - Key: ManagedBy
          Value: aws-ai-team-permission-sets
        - Key: Purpose
          Value: ai-programmatic-access
        - Key: AccessTier
          Value: read-only
        - Key: GitHub
          Value: quiverstone/armory

Outputs:
  oPermissionSetArn:
    Description: ARN of the ai-cost-analyst permission set.
    Value: !GetAtt rSsoPermissionSetAiCostAnalyst.PermissionSetArn
    Export:
      Name: !Sub ${AWS::StackName}-oPermissionSetArn

  oPermissionSetName:
    Description: Name of the permission set.
    Value: ai-cost-analyst
    Export:
      Name: !Sub ${AWS::StackName}-oPermissionSetName
