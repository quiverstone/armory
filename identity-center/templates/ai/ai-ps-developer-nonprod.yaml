AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  AI programmatic-access Permission Set (ai-developer-nonprod): PowerUser-style
  build access for AI tooling (all services except IAM/Organizations mgmt) with
  the shared AI destructive-action guardrail Deny layered on top. Intended for
  non-production accounts. Restrict blast radius via TEAM approval scope + SCPs.

Metadata:
  metaTemplateInfo:
    PermissionSetName: ai-developer-nonprod
    Tier: builder-guardrailed
    ManagedBy: aws-ai-team-permission-sets
    Note: >-
      PowerUserAccess already excludes IAM/Organizations write. The Deny below
      adds protection for data-store teardown, audit tampering and KMS deletion
      that PowerUser would otherwise permit.
    Version: 1.0.0
    Source: armory/identity-center/templates/ai/ai-ps-developer-nonprod.yaml
    LastUpdated: 20261113

  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: IAM Identity Center
        Parameters:
          - pInstanceArn
      - Label:
          default: Permission Set Configuration
        Parameters:
          - pSessionDuration
      - Label:
          default: Governance Tags
        Parameters:
          - pEnvironment
          - pProject
          - pOwner
          - pCostCenter
          - pDataClassification

Parameters:
  pInstanceArn:
    Type: String
    Description: ARN of the IAM Identity Center instance (sso-admin list-instances)
    AllowedPattern: "^arn:aws[a-z-]*:sso:::instance/ssoins-[0-9a-f]{16}$"
    ConstraintDescription: Must be an IAM Identity Center instance ARN

  pSessionDuration:
    Type: String
    Description: Max session duration (ISO-8601).
    Default: PT1H
    AllowedValues: [PT1H, PT2H, PT4H, PT8H, PT12H]
    ConstraintDescription: Must be one of PT1H, PT2H, PT4H, PT8H, PT12H

  pEnvironment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod, all]
    Description: Deployment environment scope for the tag (non-prod intended).
    ConstraintDescription: Must be dev, staging, prod or all

  pProject:
    Type: String
    Default: aws-ai-team-permission-sets
    Description: Project name tag.
    AllowedPattern: ^[\w .:/=+@-]{1,256}$
    ConstraintDescription: '1-256 letters, digits, spaces and _ . : / = + @ -'

  pOwner:
    Type: String
    Default: owner@example.com
    Description: Owning team email tag.
    AllowedPattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
    ConstraintDescription: Must be an email address

  pCostCenter:
    Type: String
    Default: unassigned
    Description: Cost center id tag.
    AllowedPattern: ^[\w .:/=+@-]{1,256}$
    ConstraintDescription: '1-256 letters, digits, spaces and _ . : / = + @ -'

  pDataClassification:
    Type: String
    Default: internal
    AllowedValues: [public, internal, confidential, restricted]
    Description: Data classification tag.
    ConstraintDescription: Must be public, internal, confidential or restricted

Resources:
  rSsoPermissionSetAiDeveloperNonprod:
    Type: AWS::SSO::PermissionSet
    Properties:
      Name: ai-developer-nonprod
      Description: "AI developer (non-prod): PowerUser build + AI destructive-action guardrail Deny."
      InstanceArn: !Ref pInstanceArn
      SessionDuration: !Ref pSessionDuration
      ManagedPolicies:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/PowerUserAccess
      InlinePolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AiGuardrailDenyDestructive
            Effect: Deny
            Action:
              # Audit / detective control tampering
              - cloudtrail:StopLogging
              - cloudtrail:DeleteTrail
              - cloudtrail:UpdateTrail
              - cloudtrail:DeleteEventDataStore
              - config:DeleteConfigurationRecorder
              - config:StopConfigurationRecorder
              - config:DeleteDeliveryChannel
              - config:DeleteConfigRule
              - guardduty:DeleteDetector
              - guardduty:DisassociateFromMasterAccount
              - securityhub:DisableSecurityHub
              - securityhub:DeleteMembers
              - access-analyzer:DeleteAnalyzer
              # KMS destruction
              - kms:ScheduleKeyDeletion
              - kms:DisableKey
              - kms:DisableKeyRotation
              - kms:PutKeyPolicy
              - kms:DeleteAlias
              # Data-store teardown
              - s3:DeleteBucket
              - s3:PutBucketPolicy
              - s3:PutBucketPublicAccessBlock
              - dynamodb:DeleteTable
              - dynamodb:DeleteBackup
              - rds:DeleteDBInstance
              - rds:DeleteDBCluster
              - rds:DeleteDBClusterSnapshot
              - rds:DeleteDBSnapshot
              - ec2:DeleteVolume
              - ec2:DeleteSnapshot
              - elasticfilesystem:DeleteFileSystem
              - backup:DeleteBackupVault
              - backup:DeleteRecoveryPoint
              # Network teardown that isolates prod
              - ec2:DeleteVpc
              - ec2:DeleteSubnet
              - ec2:DeleteInternetGateway
              - ec2:DeleteNatGateway
              - ec2:DeleteRouteTable
              - ec2:DeleteTransitGateway
            Resource: "*"
      Tags:
        - Key: Name
          Value: ai-developer-nonprod
        - Key: Environment
          Value: !Ref pEnvironment
        - Key: Project
          Value: !Ref pProject
        - Key: Owner
          Value: !Ref pOwner
        - Key: CostCenter
          Value: !Ref pCostCenter
        - Key: DataClassification
          Value: !Ref pDataClassification
        - Key: ManagedBy
          Value: aws-ai-team-permission-sets
        - Key: Purpose
          Value: ai-programmatic-access
        - Key: AccessTier
          Value: builder-guardrailed
        - Key: GitHub
          Value: quiverstone/armory

Outputs:
  oPermissionSetArn:
    Description: ARN of the ai-developer-nonprod permission set.
    Value: !GetAtt rSsoPermissionSetAiDeveloperNonprod.PermissionSetArn
    Export:
      Name: !Sub ${AWS::StackName}-oPermissionSetArn

  oPermissionSetName:
    Description: Name of the permission set.
    Value: ai-developer-nonprod
    Export:
      Name: !Sub ${AWS::StackName}-oPermissionSetName
