AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  AI programmatic-access Permission Set (ai-security-auditor): read-only security
  posture review across the org (Security Hub, GuardDuty, Config, IAM Access
  Analyzer, Inspector) for AI tooling. Detective only, no remediation writes.

Metadata:
  metaTemplateInfo:
    PermissionSetName: ai-security-auditor
    Tier: read-only
    ManagedBy: aws-ai-team-permission-sets
    Version: 1.0.0
    Source: armory/identity-center/templates/ai/ai-ps-security-auditor.yaml
    LastUpdated: 20261113

  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: IAM Identity Center
        Parameters:
          - pInstanceArn
      - Label:
          default: Permission Set Configuration
        Parameters:
          - pSessionDuration
      - Label:
          default: Governance Tags
        Parameters:
          - pEnvironment
          - pProject
          - pOwner
          - pCostCenter
          - pDataClassification

Parameters:
  pInstanceArn:
    Type: String
    Description: ARN of the IAM Identity Center instance (sso-admin list-instances)
    AllowedPattern: "^arn:aws[a-z-]*:sso:::instance/ssoins-[0-9a-f]{16}$"
    ConstraintDescription: Must be an IAM Identity Center instance ARN

  pSessionDuration:
    Type: String
    Description: Max session duration (ISO-8601).
    Default: PT1H
    AllowedValues: [PT1H, PT2H, PT4H, PT8H, PT12H]
    ConstraintDescription: Must be one of PT1H, PT2H, PT4H, PT8H, PT12H

  pEnvironment:
    Type: String
    Default: all
    AllowedValues: [dev, staging, prod, all]
    Description: Deployment environment scope for the tag.
    ConstraintDescription: Must be dev, staging, prod or all

  pProject:
    Type: String
    Default: aws-ai-team-permission-sets
    Description: Project name tag.
    AllowedPattern: ^[\w .:/=+@-]{1,256}$
    ConstraintDescription: '1-256 letters, digits, spaces and _ . : / = + @ -'

  pOwner:
    Type: String
    Default: owner@example.com
    Description: Owning team email tag.
    AllowedPattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
    ConstraintDescription: Must be an email address

  pCostCenter:
    Type: String
    Default: unassigned
    Description: Cost center id tag.
    AllowedPattern: ^[\w .:/=+@-]{1,256}$
    ConstraintDescription: '1-256 letters, digits, spaces and _ . : / = + @ -'

  pDataClassification:
    Type: String
    Default: confidential
    AllowedValues: [public, internal, confidential, restricted]
    Description: Data classification tag (security findings are confidential).
    ConstraintDescription: Must be public, internal, confidential or restricted

Resources:
  rSsoPermissionSetAiSecurityAuditor:
    Type: AWS::SSO::PermissionSet
    Properties:
      Name: ai-security-auditor
      Description: "AI security auditor: SecurityAudit + org read-only for posture review. Detective, no writes."
      InstanceArn: !Ref pInstanceArn
      SessionDuration: !Ref pSessionDuration
      ManagedPolicies:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/SecurityAudit
        - !Sub arn:${AWS::Partition}:iam::aws:policy/ReadOnlyAccess
      InlinePolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: SecurityServicesReadExtra
            Effect: Allow
            Action:
              - securityhub:Get*
              - securityhub:List*
              - securityhub:Describe*
              - securityhub:BatchGet*
              - guardduty:Get*
              - guardduty:List*
              - guardduty:Describe*
              - access-analyzer:Get*
              - access-analyzer:List*
              - inspector2:Get*
              - inspector2:List*
              - inspector2:Describe*
              - config:Get*
              - config:List*
              - config:Describe*
              - config:SelectResourceConfig
              - config:SelectAggregateResourceConfig
            Resource: "*"
      Tags:
        - Key: Name
          Value: ai-security-auditor
        - Key: Environment
          Value: !Ref pEnvironment
        - Key: Project
          Value: !Ref pProject
        - Key: Owner
          Value: !Ref pOwner
        - Key: CostCenter
          Value: !Ref pCostCenter
        - Key: DataClassification
          Value: !Ref pDataClassification
        - Key: ManagedBy
          Value: aws-ai-team-permission-sets
        - Key: Purpose
          Value: ai-programmatic-access
        - Key: AccessTier
          Value: read-only
        - Key: GitHub
          Value: quiverstone/armory

Outputs:
  oPermissionSetArn:
    Description: ARN of the ai-security-auditor permission set.
    Value: !GetAtt rSsoPermissionSetAiSecurityAuditor.PermissionSetArn
    Export:
      Name: !Sub ${AWS::StackName}-oPermissionSetArn

  oPermissionSetName:
    Description: Name of the permission set.
    Value: ai-security-auditor
    Export:
      Name: !Sub ${AWS::StackName}-oPermissionSetName
