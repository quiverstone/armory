---
AWSTemplateFormatVersion: 2010-09-09

Description: Create a monthly budget with customizable amounts for each month

Parameters:
  pEmail:
    Type: String
    Description: User or Mailbox Email Address
    AllowedPattern: ^$|^[^@\s]+@[^@\s]+\.[^@\s]+$
    ConstraintDescription: Must be a valid email address

Resources:
  rBudgetDailyAll:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: Daily-All-Services
        BudgetLimit:
          Amount: 3496
          Unit: USD
        TimeUnit: DAILY
        BudgetType: COST
        CostTypes:
          IncludeTax: true
          IncludeSubscription: false
          UseBlended: false
          IncludeRefund: false
          IncludeCredit: false
          IncludeUpfront: false
          IncludeRecurring: true
          IncludeOtherSubscription: false
          IncludeSupport: false
          IncludeDiscount: true
          UseAmortized: true
      NotificationsWithSubscribers:
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 99
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref pEmail

  rBudgetDailyAutoAll:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        AutoAdjustData:
          AutoAdjustType: HISTORICAL
          HistoricalOptions:
            BudgetAdjustmentPeriod: 3
        BudgetName: Daily-Auto-All-Services
        TimeUnit: DAILY
        BudgetType: COST
        CostTypes:
          IncludeTax: true
          IncludeSubscription: false
          UseBlended: false
          IncludeRefund: false
          IncludeCredit: false
          IncludeUpfront: false
          IncludeRecurring: true
          IncludeOtherSubscription: false
          IncludeSupport: false
          IncludeDiscount: true
          UseAmortized: true
      NotificationsWithSubscribers:
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 99
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref pEmail

  rBudgetDailyAutoEc2:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        AutoAdjustData:
          AutoAdjustType: HISTORICAL
          HistoricalOptions:
            BudgetAdjustmentPeriod: 3
        BudgetName: Daily-Auto-EC2
        TimeUnit: DAILY
        BudgetType: COST
        CostFilters:
          Service:
            - Amazon Elastic Compute Cloud - Compute
        CostTypes:
          IncludeTax: true
          IncludeSubscription: false
          UseBlended: false
          IncludeRefund: false
          IncludeCredit: false
          IncludeUpfront: false
          IncludeRecurring: true
          IncludeOtherSubscription: false
          IncludeSupport: false
          IncludeDiscount: true
          UseAmortized: true
      NotificationsWithSubscribers:
