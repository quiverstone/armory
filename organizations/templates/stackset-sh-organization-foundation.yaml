---
AWSTemplateFormatVersion: "2010-09-09"

Description: Foundational Organization Security (SH) Resource Deployment

Metadata:
  metaTemplateInfo:
    Name: stackset-sh-organization-foundation
    Description: Foundational Organization Security Resource Deployment
    Version: 1.0.0
    Source: armory/organizations/templates/stackset-sh-organization-foundation.yaml
    Note: Deploy from management account to all accounts for Security Hub Checks
    LastUpdated: 20241206
    Nonce: 20241206

Parameters:
  pSupportAccountId:
    Description: Account ID for support account assume role
    Type: String
    AllowedPattern: ^\d{12}$
    ConstraintDescription: Must be a 12-digit AWS account ID

  pDeploymentOUs:
    Description: Which ORG OU(s) is this deploying to
    Type: String
    MinLength: 6

  pHomeRegion:
    Description: Home Control Tower and Central Security Hub Region
    Type: String
    MinLength: 8
    AllowedPattern: ^[a-z]{2}(-gov)?-[a-z]+-\d$
    ConstraintDescription: Must be an AWS region code such as us-east-2

  pConfigRegions:
    Description: List of regions to deploy the stackset to
    Type: String

  pNonceValue:
    Description: Random Identifier to force update of stackset resource
    Type: String

Conditions:
  cIsHomeRegion: !Equals [!Ref AWS::Region, !Ref pHomeRegion] ## only launch global resources in single/home region

Resources:

  ##############################
  ## IAM Support Role (IAM.18 - Low)
  ##############################
  rStackSupportRoleMgmt:
    Condition: cIsHomeRegion
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://s3.us-east-2.amazonaws.com/armory.quiverstone.io/iam/templates/role-support-assume.yaml
      Parameters:
        pSupportAccountId: !Ref pSupportAccountId
        pHomeRegion: !Ref pHomeRegion
        pNonceValue: !Ref pNonceValue
      Tags:
        - Key: GitHub
          Value: quiverstone/armory

  rStackSetSupportRoleChildren:
    Condition: cIsHomeRegion
    Type: AWS::CloudFormation::StackSet
    Properties:
      StackSetName: iam-role-assume-support
      Description: Support Role - DO NOT DELETE - Child Account Support Access Role
      PermissionModel: SERVICE_MANAGED
      AutoDeployment:
        Enabled: true
        RetainStacksOnAccountRemoval: false
      Capabilities:
        - CAPABILITY_IAM
        - CAPABILITY_NAMED_IAM
        - CAPABILITY_AUTO_EXPAND
      OperationPreferences:
        MaxConcurrentPercentage: 100
        FailureTolerancePercentage: 100
        RegionConcurrencyType: PARALLEL
      StackInstancesGroup:
        - Regions:
            - !Ref pHomeRegion
          DeploymentTargets:
            OrganizationalUnitIds:
              - !Ref pDeploymentOUs
      Parameters:
        - ParameterKey: pSupportAccountId
          ParameterValue: !Ref pSupportAccountId
        - ParameterKey: pHomeRegion
          ParameterValue: !Ref pHomeRegion
        - ParameterKey: pNonceValue
          ParameterValue: !Ref pNonceValue
      TemplateURL: https://s3.us-east-2.amazonaws.com/armory.quiverstone.io/iam/templates/role-support-assume.yaml
      Tags:
        - Key: GitHub
          Value: quiverstone/armory

  ##############################
  ## PASSWORD LAMBDA (IAM.15- Med, IAM.16 - Low)
  ##############################
  rStackPasswordSettingsMgmt:
    Condition: cIsHomeRegion
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://s3.us-east-2.amazonaws.com/armory.quiverstone.io/iam/templates/iam-settings-password-policy.yaml
      Parameters:
        pHomeRegion: !Ref pHomeRegion
        pNonceValue: !Ref pNonceValue
      Tags:
        - Key: GitHub
          Value: quiverstone/armory

  rStackSetPasswordSettingsChildren:
    Condition: cIsHomeRegion
    Type: AWS::CloudFormation::StackSet
    Properties:
      StackSetName: iam-settings-password-policy
      Description: IAM Settings - DO NOT DELETE - IAM User Password Default Policy
      PermissionModel: SERVICE_MANAGED
      AutoDeployment:
        Enabled: true
        RetainStacksOnAccountRemoval: false
      Capabilities:
        - CAPABILITY_IAM
        - CAPABILITY_NAMED_IAM
        - CAPABILITY_AUTO_EXPAND
      OperationPreferences:
        MaxConcurrentPercentage: 100
        FailureTolerancePercentage: 100
        RegionConcurrencyType: PARALLEL
      StackInstancesGroup:
        - Regions:
            - !Ref pHomeRegion
          DeploymentTargets:
            OrganizationalUnitIds:
              - !Ref pDeploymentOUs
      Parameters:
        - ParameterKey: pHomeRegion
          ParameterValue: !Ref pHomeRegion
        - ParameterKey: pNonceValue
          ParameterValue: !Ref pNonceValue
      TemplateURL: https://s3.us-east-2.amazonaws.com/armory.quiverstone.io/iam/templates/iam-settings-password-policy.yaml
      Tags:
        - Key: GitHub
          Value: quiverstone/armory

  ##############################
  ## EBS Encryption (EC2.7)
  ##############################
  rStackEbsEncryptionMgmt:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://s3.us-east-2.amazonaws.com/armory.quiverstone.io/ec2/templates/ebs-enable-encryption.yaml
      Parameters:
        pNonceValue: !Ref pNonceValue
      Tags:
        - Key: GitHub
          Value: quiverstone/armory

  rStackSetEbsEncryptionChildren:
    Type: AWS::CloudFormation::StackSet
    Properties:
      StackSetName: enable-ebs-encryption
      Description: EBS Encryption - DO NOT DELETE - Configured Default EBS Encryption
      PermissionModel: SERVICE_MANAGED
      AutoDeployment:
        Enabled: true
        RetainStacksOnAccountRemoval: false
      Capabilities:
        - CAPABILITY_IAM
        - CAPABILITY_NAMED_IAM
        - CAPABILITY_AUTO_EXPAND
      OperationPreferences:
        MaxConcurrentPercentage: 100
        FailureTolerancePercentage: 100
        RegionConcurrencyType: PARALLEL
      StackInstancesGroup:
        - Regions: !Split [",", !Ref pConfigRegions]
          DeploymentTargets:
            OrganizationalUnitIds:
              - !Ref pDeploymentOUs
      Parameters:
        - ParameterKey: pNonceValue
          ParameterValue: !Ref pNonceValue
      TemplateURL: https://s3.us-east-2.amazonaws.com/armory.quiverstone.io/ec2/templates/ebs-enable-encryption.yaml
      Tags:
        - Key: GitHub
          Value: quiverstone/armory

Outputs:
  oNonceValue:
    Description: Just an output of the Nonce value
    Value: !Ref pNonceValue
