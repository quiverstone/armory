---
AWSTemplateFormatVersion: 2010-09-09

Description: Configure the AWSCloudFormationStackSetAdministrationRole to enable use of AWS CloudFormation StackSets.

Parameters:
  pAdministratorAccountId:
    Type: String
    Description: AWS Account Id of the administrator account (the account in which StackSets will be created).
    MaxLength: 12
    MinLength: 12
    AllowedPattern: ^\d{12}$
    ConstraintDescription: Must be a 12-digit AWS account ID

  pNonceValue:
    Description: Random Identifier to force update of stackset resource
    Type: String

Resources:
  rIamRoleCloudFormationAdmin:
    Type: AWS::IAM::Role
    Properties:
      RoleName: AWSCloudFormationStackSetAdministrationRole
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: /
      Tags:
        - Key: GitHub
          Value: quiverstone/armory

  rIamPolicyCloudFormationAdminAssumeExecution:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: AssumeRole-AWSCloudFormationStackSetExecutionRole for rIamRoleCloudFormationAdmin
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - sts:AssumeRole
            Resource:
              - !Sub arn:aws:iam::${AWS::AccountId}:role/AWSCloudFormationStackSetExecutionRole
      Roles:
        - !Ref rIamRoleCloudFormationAdmin

  rIamRoleExecution:
    Type: AWS::IAM::Role
    Properties:
      RoleName: AWSCloudFormationStackSetExecutionRole
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              AWS:
                - !Ref pAdministratorAccountId
            Action:
              - sts:AssumeRole
      Path: /
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AdministratorAccess
      Tags:
        - Key: GitHub
          Value: quiverstone/armory

Outputs:
  oNonceValue:
    Description: Just an output of the Nonce value
    Value: !Ref pNonceValue
